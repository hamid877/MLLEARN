[project]
name = "mllearn"
version = "0.1.0"
description = "A hands-on machine learning learning lab, from fundamentals to deep learning."
readme = "README.md"
authors = [
    { name = "Mohd Hamid", email = "hamidmohd726@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "jupyterlab>=4.6.5",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "pandas>=3.1.0",
    "scikit-learn>=1.9.1",
    "seaborn>=0.13.2",
    "ucimlrepo>=0.0.7",
]


[build-system]
requires = ["uv_build>=0.12.21,<0.13.0"]
build-backend = "uv_build"
